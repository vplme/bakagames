name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Binary assets live in Git LFS; without this the checkout
          # yields pointer files instead of real images.
          lfs: true

      - uses: ./.github/actions/setup-flutter

      - name: Check release automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # The Flutter app: static analysis plus widget and integration tests.
      - name: Flutter app
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      # The pure Dart engines have no Flutter dependency, so they run under
      # plain `dart test` -- keeping that separation honest is the point.
      - name: Pure Dart packages
        run: |
          for pkg in game_core bird_sort match_three; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && dart pub get && dart test)
            echo "::endgroup::"
          done

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - name: Build debug APK
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
