name: baka_games
description: "Baka Games — small puzzle games. First up: Bird Sort."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  game_core:
    path: ../packages/game_core
  match_three:
    path: ../packages/match_three
  bird_sort:
    path: ../packages/bird_sort
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  flame: ^1.38.2
  forge2d: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.0
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/aviary/
    - assets/sweets/
    - assets/pusher/
